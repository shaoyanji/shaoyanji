projects:
  - repo: nixconfig
    url: "https://github.com/shaoyanji/nixconfig"
    what: One flake for NixOS, nix-darwin, Home Manager and WSL; hosts, modules, tasks and docs from a single inventory.
  - repo: bountystash
    url: "https://github.com/shaoyanji/bountystash"
    what: Thin server-rendered Go app that turns messy asks into immutable, hash-stable work packets.
  - repo: pancakes-harness
    url: "https://github.com/shaoyanji/pancakes-harness"
    what: Local-first context and egress kernel; typed ingress, replayable consult records, bounded packets.
  - repo: fibtransponder
    url: "https://github.com/shaoyanji/fibtransponder"
    what: Fibonacci-radix streaming state machine, tested as a tokenization substrate rather than a product.
